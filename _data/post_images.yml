# The picture on each post's card, keyed by the post's URL.
#
# A post that has pictures of its own uses its first one (charts, screenshots, your photos);
# its entry here only describes it (`alt`) and says how to frame it (`fit`).
# A post with no picture of its own uses the Unsplash photo given here (`photo`, free under the
# Unsplash License); `by` and `credit` record where it came from and aren't shown on the page.
#
# Optional per post:
#   fit:   cover to fill the card (photos); otherwise the picture shows whole on white
#   focus: CSS object-position for the crop
#   lines: a hand-set two-line headline (otherwise the title wraps on its own)
#   blurb: the one-sentence summary (otherwise the post's excerpt)
# A post with neither gets a quiet typographic card.

